repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd gym-server && go run github.com/golangci/golangci-lint/cmd/golangci-lint run ./...'
        language: system
        pass_filenames: false


  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'cd gym-server && gofmt -w $(find . -name "*.go")'
        language: system
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
