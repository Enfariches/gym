name: Security Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  secret-detection:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Save JSON report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

  image-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f gym-server/Dockerfile.prod \
            -t gym-server:security .

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gym-server:security
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Save image report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gym-server:security
          format: json
          output: trivy-image-report.json

      - name: Upload image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json

  sbom-generation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  security-gate:
    runs-on: ubuntu-latest

    needs:
      - secret-detection
      - sca-scan
      - image-scan
      - sbom-generation

    steps:
      - name: Security Gate
        run: |
          echo "All security checks passed"
