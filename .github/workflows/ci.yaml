name: Optimized Go CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Go Format Check
        working-directory: ./gym-server
        run: |
          test -z "$(gofmt -l .)"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run Tests
        working-directory: ./gym-server
        run: |
          go test ./... -v || true

  security-sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  security-sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  build-docker:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: gym-server/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gym-server:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-gate:
    runs-on: ubuntu-latest

    needs:
      - security-sast
      - security-sca

    steps:
      - name: Security Gate
        run: |
          echo "Security checks passed"
