syntax="proto3";

package auth;
option go_package = "github.com/Enfariches/gym/protogen";

service Auth{
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest{
    string email = 1;
    string password = 2;
}

message LoginRequest{
    string email = 1;
    string password = 2;
    int64 user_id = 3;
}

message RegisterResponse{
    string user_id = 1;
}

message LoginResponse{
    string token = 1;
}
    