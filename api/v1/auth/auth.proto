syntax="proto3";

package auth;
option go_package = "github.com/Enfariches/gym/protogen";

service Auth {
    rpc Register(AuthRequest) returns (RegisterResponse);
    rpc Login(AuthRequest) returns (LoginResponse);
}

message AuthRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}

message RegisterResponse {}
    