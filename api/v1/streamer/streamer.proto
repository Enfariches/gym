syntax = "proto3";

package streamer;
option go_package = "github.com/Enfariches/gym/protogen";

// Сервис "Стример" для передачи видео и загрузки видео.
service Streamer {
  // Передает чанк видео.
  rpc StreamVideo(StreamVideoRequest) returns (stream VideoChunk);

  // Загружает новое видео.
  rpc UploadVideo(stream VideoChunk) returns (UploadVideoResponse);
}

// Запрос на начало стрима видео по айди.
message StreamVideoRequest {
  // ID видео для запуска.
  string video_id = 1;
}

// Кусок памяти видео.
message VideoChunk {
  // Байт видео.
  bytes data = 1;
}

// Ответ на запрос загрузки видео.
message UploadVideoResponse {
  // Сообщение о cтатусе запроса.
  string message = 1;
}