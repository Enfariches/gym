syntax="proto3";

package schedule;
option go_package = "github.com/Enfariches/gym/protogen";

import "google/protobuf/empty.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

// Сервис для управления расписанием.
service ScheduleService {

    // Создает новое расписание.
    rpc CreateSchedules(CreateSchedulesRequest) returns (CreateSchedulesResponse);

    // Получает расписание.
    rpc GetSchedule(GetScheduleRequest) returns (Schedule);

    // Получает список расписаний, по ID администратора, которое передается в контексте.
    rpc ListSchedule(google.protobuf.Empty) returns (ListScheduleResponse);

    // Обновляет расписание.
    rpc UpdateSchedule(UpdateScheduleRequest) returns (Schedule);

    // Удаляет расписание.
    rpc DeleteSchedule(DeleteScheduleRequest) returns (google.protobuf.Empty);
}

// Запрос на создание расписания.
message CreateSchedulesRequest {
    // Расписания, которые необходимо создать.
    repeated Schedule schedules = 1;
}

// Ответ на запрос создания расписания.
// Возвращает список сохраненных в БД расписаний.
message CreateSchedulesResponse {
    // Список сохраненных расписаний.
    repeated Schedule schedules = 1;
}

//Запрос на получение расписания.
message GetScheduleRequest {
    // ID расписания, которое необходимо получить.
    int64 schedule_id = 1;
}

// Ответ на запрос списка расписаний.
message ListScheduleResponse {
    // Список расписаний.
    repeated Schedule schedules = 1;
}

// Запрос на обновление расписания.
message UpdateScheduleRequest {
    // Администратор, который будет обновлен.
    Schedule schedule = 1;

    // Маска полей, которые будут обновлены.
    google.protobuf.FieldMask field_mask = 2;
}

// Запрос на удаление расписания.
message DeleteScheduleRequest {
    // ID расписания, которое необходимо удалить.
    int64 schedule_id = 1;
}

// Струкутура расписания.
message Schedule {
    // ID расписания.
    int64 id = 1 [(google.api.field_behavior) = OPTIONAL];

    // Cron-выражение - представления времени запуска. (Формат crontab)
    //
    // * * * * * 
    // | | | | |
    // | | | | +----- Дни недели (диапазон: 1-7)
    // | | | +------- Месяцы     (диапазон: 1-12)
    // | | +--------- Дни месяца (диапазон: 1-31)
    // | +----------- Часы       (диапазон: 0-23)
    // +------------- Минуты     (диапазон: 0-59)
    //
    // Примеры: 
    // * * * * * (каждую минуту, каждого часа и каждого тд)
    // 30 * * * * (в 30 минут, каждого часа и каждого тд)
    // https://ru.wikipedia.org/wiki/Cron#crontab
    string cron_expression = 2;

    // Активно расписание или нет.
    bool is_active = 3;

    // ID медиа, которое необходимо воспроизвести по расписанию.
    int64 media_id = 4;

    // ID админа, который создал расписание.
    int64 admin_id = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

    // Время создания расписания.
    string created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}
    