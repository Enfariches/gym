services:
  postgres:
    container_name: postgres
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: health
      POSTGRES_PASSWORD: root
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - 5436:5432
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    container_name: minio
    image: minio/minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # WebUI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin  # Логин
      MINIO_ROOT_PASSWORD: admin123  # Пароль
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 3
    networks:
      - gym-network

  envoy:
    image: envoyproxy/envoy:v1.28.0
    container_name: envoy
    ports:
      - "8085:8085"  # HTTP вход
      - "8443:8443"  # HTTPS вход
    volumes:
      - ./envoyproxy/envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - gym-server
    networks:
      - gym-network

  gym-docs:
    image: nginx:alpine
    container_name: gym-docs
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    ports:
      - "8083:80"

  gym-server:
    container_name: gym-server
    build: ./gym-server
    ports:
      - 9090:9090
      - 3000:3000
    environment:
      DB_URL: "postgres:root@postgres:5432/health?sslmode=disable"
    volumes:
    - ./gym-server:/gym
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gym-network


  gym-admin:
    container_name: gym-admin-panel
    build:
      context: ./gym-admin-panel
    ports:
      - 8080:80
    # depends_on:
    #   - gym-server
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  postgres_data:
  gym-server:
  minio_data:
