services:
  postgres:
    container_name: postgres
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: health
      POSTGRES_PASSWORD: root
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - 5436:5432
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  envoy:
    image: envoyproxy/envoy:v1.28.0
    container_name: envoy
    ports:
      - "8085:8085"  # HTTP вход
      - "8443:8443"  # HTTPS вход
    volumes:
      - ./envoyproxy/envoy.yaml:/etc/envoy/envoy.yaml  # Подключаем конфиг

  gym-docs:
    image: nginx:alpine
    container_name: gym-docs
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    ports:
      - "8083:80"

  gym-server:
    container_name: gym-server
    build: ./gym-server
    ports:
      - 9090:9090
    depends_on:
      postgres:
        condition: service_healthy
    env_file: 
      - gym-server/.env
    networks:
      - gym-network
    restart: always

  gym-admin:
    container_name: gym-admin-panel
    build:
      context: ./gym-admin-panel
    ports:
      - 8080:80
    depends_on:
      - gym-server
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  postgres_data:

